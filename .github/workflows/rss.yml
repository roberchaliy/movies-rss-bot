name: RSS to Telegram

on:
  schedule:
     - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: rss-bot

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Check feeds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_ONCE: "1"
        run: python rss_bot.py

      - name: Save seen.json
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git push
