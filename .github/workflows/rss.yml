name: RSS to Telegram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: rss-bot

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # всегда свежий seen.json, а не тот, что был при запуске

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Check feeds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_ONCE: "1"
        run: python rss_bot.py

      - name: Save seen.json
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          cp seen.json /tmp/seen_local.json
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # объединяем свой список с тем, что уже лежит в репозитории
            python -c "
          import json, os
          a = json.load(open('/tmp/seen_local.json'))
          b = json.load(open('seen.json')) if os.path.exists('seen.json') else []
          merged = list(dict.fromkeys(b + a))[-5000:]
          json.dump(merged, open('seen.json', 'w'))
          "
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -m "update seen.json"
            git push && exit 0
            sleep 5
          done
          exit 1
